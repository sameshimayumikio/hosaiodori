<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ALL 円弧面＋ジャイロ テスト | ユビキタス伝芸</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="data:," />
  <style>
    #start-overlay .intro {
      width: min(88vw, 370px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #fff;
      text-align: center;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }
    .intro p { margin: 0; font-size: 14px; }
    #start-button { max-width: 100%; line-height: 1.4; }
    #test-status {
      position: fixed;
      z-index: 7;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      width: min(94vw, 470px);
      padding: 12px 15px;
      border-radius: 12px;
      background: rgba(0, 0, 0, .72);
      color: #fff;
      font: 14px/1.5 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
    }
    #test-status[hidden] { display: none; }
    /* Small animated gesture hint, separate from AR and playback touch targets. */
    #zoom-hint {
      position: fixed;
      z-index: 7;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 13px;
      border-radius: 15px;
      background: rgba(0, 0, 0, .74);
      color: #fff;
      font-family: system-ui, sans-serif;
      line-height: 1.35;
      white-space: nowrap;
      pointer-events: none;
    }
    #zoom-hint[hidden] { display: none; }
    #zoom-hint .gesture-drawing {
      width: 72px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #zoom-hint .gesture-finger {
      width: 13px;
      height: 24px;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(255,255,255,.3);
    }
    #zoom-hint .gesture-finger:first-child {
      animation: pinch-left 2s ease-in-out infinite;
    }
    #zoom-hint .gesture-finger:last-child {
      animation: pinch-right 2s ease-in-out infinite;
    }
    #zoom-hint .gesture-arrow { font-size: 23px; font-weight: 600; opacity: .9; }
    #zoom-hint .gesture-title { font-size: 14px; font-weight: 700; }
    #zoom-hint .gesture-sub { font-size: 11px; opacity: .85; }
    @keyframes pinch-left {
      0%, 100% { transform: translateX(10px); }
      50% { transform: translateX(-2px); }
    }
    @keyframes pinch-right {
      0%, 100% { transform: translateX(-10px); }
      50% { transform: translateX(2px); }
    }
    @media (prefers-reduced-motion: reduce) {
      #zoom-hint .gesture-finger { animation: none; }
    }
    /* Keep two-finger gestures on the AR surface instead of browser page zoom. */
    #ar-container, #video-tap-area { touch-action: none; }
    /* Portrait: turn all visitor-facing text and buttons 90 degrees.
       When the visitor turns the phone, landscape styles above apply
       naturally. The AR camera/canvas is intentionally never rotated. */
    @media (orientation: portrait) {
      #start-overlay .intro {
        width: calc(100dvh - 56px);
        max-width: none;
        max-height: calc(100vw - 24px);
        gap: 10px;
        transform: rotate(90deg);
      }
      #start-overlay .intro p { font-size: 13px; }
      #start-button { padding: 13px 26px; }
      #test-status {
        top: 50%;
        left: calc(100% - 47px);
        width: min(calc(100dvh - 40px), 470px);
        max-width: none;
        transform: translate(-50%, -50%) rotate(90deg);
      }
      #play-icon {
        transform: translate(-50%, -50%) rotate(90deg);
      }
      #zoom-hint {
        top: 50%;
        left: 42px;
        right: auto;
        bottom: auto;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <div id="start-overlay">
    <div class="intro">
      <p>スマホを横向きにしてご覧ください。</p>
      <button id="start-button" type="button">タップして、アクリルスタンドをスキャンしよう</button>
      <p>カメラと傾きセンサーの使用を許可してください。</p>
    </div>
  </div>
  <div id="ar-container"></div>
  <div id="test-status" role="status" aria-live="polite" hidden></div>
  <div id="zoom-hint" aria-label="2本指で拡大・縮小。ダブルタップで元に戻す。" hidden>
    <div class="gesture-drawing" aria-hidden="true">
      <span class="gesture-finger"></span>
      <span class="gesture-arrow">↔</span>
      <span class="gesture-finger"></span>
    </div>
    <div>
      <div class="gesture-title">2本指で拡大・縮小</div>
      <div class="gesture-sub">ダブルタップで元に戻す</div>
    </div>
  </div>
  <div id="video-tap-area">
    <svg id="play-icon" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <circle cx="40" cy="40" r="40" fill="#e60012" />
      <path d="M32 24 L58 40 L32 56 Z" fill="#fff" />
    </svg>
  </div>
  <script>
    window.ALL_ARC_TEST_CONFIG = {
      imageTargetSrc: '../assets/05/05_target_800.mind',
      videoSrc: '../assets/all/all_dance.mp4',
      planeScale: 4.0,          // AR動画の高さ（平面版と同じ初期値）
      planeOffsetX: -0.5,       // 横位置。プラスで右、マイナスで左
      planeOffsetY: 0,          // 縦位置。プラスで上、マイナスで下
      fifthPersonFraction: 0.45, // 動画の横幅のうち、5番の基準位置（0〜1）
      curveAngleDeg: 60,        // 円弧全体の曲がり角度。0なら平面、まず50度
      curveSegments: 96,        // 円弧面の滑らかさ
      brightness: 1.2,
      zoomMin: 0.12,
      zoomMax: 3.0
    };
  </script>
  <script>
    // Plain browser script: diagnostics and click work even if ESM dependencies fail.
    window.ALL_ARC_TEST_READY = false;
    window.ALL_ARC_MOTION_PERMISSION = null;
    const startBtn = document.getElementById('start-button');
    const startPane = document.getElementById('start-overlay');
    const messagePane = document.getElementById('test-status');
    let clicked = false;
    let launched = false;
    let loadFailure = null;

    function setPageStatus(message) {
      messagePane.textContent = message;
      messagePane.hidden = !message;
    }

    function showLoadError(error) {
      loadFailure = error;
      const detail = error && (error.stack || error.message) || String(error);
      console.error('ALL arc module load:', error);
      setPageStatus('AR読み込みエラー：' + detail);
      if (!clicked) {
        startBtn.textContent = '読み込みエラー（タップして内容を確認）';
      }
    }

    function launchWhenReady() {
      if (!clicked || launched || loadFailure || typeof window.ALL_ARC_START !== 'function') return;
      launched = true;
      try {
        Promise.resolve(window.ALL_ARC_START()).catch(showLoadError);
      } catch (error) {
        showLoadError(error);
      }
    }
    window.addEventListener('ALL_ARC_READY', launchWhenReady);

    window.addEventListener('error', event => {
      if (!window.ALL_ARC_TEST_READY && !loadFailure) {
        showLoadError(new Error((event.message || 'スクリプトエラー') + ' (' + (event.filename || '') + ':' + (event.lineno || '') + ')'));
      }
    });

    startBtn.addEventListener('click', () => {
      if (clicked) return;
      clicked = true;
      startPane.classList.add('hidden');
      setPageStatus('起動操作を受け付けました。ARエンジンを読み込んでいます…');

      try {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          window.ALL_ARC_MOTION_PERMISSION = DeviceOrientationEvent.requestPermission();
        }
      } catch (error) {
        console.warn('Sensor permission request:', error);
      }
      if (loadFailure) showLoadError(loadFailure);
      else launchWhenReady();
    });

    // Explicit import allows us to report the actual rejection instead of
    // silently waiting for a module script that never calls its entrypoint.
    const moduleUrl = new URL('../js/ar-all-arc-test.js?v=20261017arc6', document.baseURI).href;
    import(moduleUrl)
      .then(() => {
        if (!window.ALL_ARC_TEST_READY) {
          showLoadError(new Error('JS読み込み後の初期化に到達しませんでした'));
        } else {
          launchWhenReady();
        }
      })
      .catch(showLoadError);

    window.setTimeout(() => {
      if (clicked && !window.ALL_ARC_TEST_READY && !loadFailure) {
        setPageStatus('ARライブラリの応答を待っています。通信が遅い可能性があります（20秒以上）。');
      }
    }, 20000);
  </script>
</body>
</html>
