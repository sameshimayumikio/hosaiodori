<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ALL ジャイロ追従テスト | ユビキタス伝芸</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="data:," />
  <style>
    #start-overlay .intro {
      width: min(88vw, 370px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      color: #fff;
      text-align: center;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }
    .intro h1 { font-size: 21px; margin: 0; }
    .intro p { margin: 0; font-size: 14px; }
    #start-button { max-width: 100%; line-height: 1.4; }
    #test-status {
      position: fixed;
      z-index: 7;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box;
      width: min(94vw, 470px);
      padding: 12px 15px;
      border-radius: 12px;
      background: rgba(0, 0, 0, .72);
      color: #fff;
      font: 14px/1.5 system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
    }
    #test-play, #test-restart {
      position: fixed;
      z-index: 8;
      bottom: max(28px, calc(env(safe-area-inset-bottom) + 16px));
      left: 50%;
      transform: translateX(-50%);
      min-width: 190px;
      max-width: 90vw;
      padding: 15px 22px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font: bold 17px system-ui, sans-serif;
      cursor: pointer;
    }
    #test-play:disabled { opacity: .4; }
    #test-play[hidden], #test-restart[hidden] { display: none; }
    #test-calibration {
      position: fixed;
      bottom: max(97px, calc(env(safe-area-inset-bottom) + 86px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      background: rgba(0,0,0,.73);
      border-radius: 10px;
      padding: 9px 10px;
      width: min(96vw, 360px);
      box-sizing: border-box;
      color: #fff;
      text-align: center;
      font: 12px/1.5 system-ui, sans-serif;
    }
    #test-calibration[hidden] { display: none; }
    .calib-row { display: flex; justify-content: center; gap: 8px; align-items: center; margin: 5px 0; }
    .calib-row button { border: 0; border-radius: 7px; background: #fff; color: #111; font: 15px system-ui, sans-serif; min-width: 45px; padding: 6px 10px; }
    .calib-row span { min-width: 108px; }
    #test-note {
      position: fixed;
      z-index: 6;
      bottom: max(212px, calc(env(safe-area-inset-bottom) + 200px));
      left: 10px;
      right: 10px;
      color: #fff;
      font: 12px/1.3 system-ui, sans-serif;
      text-align: center;
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
</head>
<body>
  <div id="start-overlay">
    <div class="intro">
      <h1>ALL ジャイロ追従テスト</h1>
      <p>5番のアクリルスタンドを認識した後、集合動画の5番付近を実物と合わせ、スマホを左右に向けて10人を見渡せるか確認します。床面固定・歩行追跡ではありません。</p>
      <button id="start-button" type="button">カメラ・傾きセンサーを起動</button>
      <p>ALLの透過動画を使用します。位置・大きさを画面のボタンで調整できます。既存のALL本番ページは変更していません。</p>
    </div>
  </div>
  <div id="ar-container"></div>
  <div id="test-status" role="status" aria-live="polite">「起動」を押してください。</div>
  <div id="test-note">5番アクスタが目印／ALL集合動画を配置</div>
  <div id="test-calibration" hidden>
    5番とAR内の5番が重なるよう位置調整
    <div class="calib-row">
      <button id="test-left" type="button" aria-label="左に移動">←</button>
      <span id="test-shift">横位置 0.00</span>
      <button id="test-right" type="button" aria-label="右に移動">→</button>
    </div>
    <div class="calib-row">
      <button id="test-smaller" type="button" aria-label="縮小">−</button>
      <span id="test-size">大きさ 1.00×</span>
      <button id="test-larger" type="button" aria-label="拡大">＋</button>
    </div>
  </div>
  <button id="test-play" disabled>35秒の踊りを再生</button>
  <button id="test-restart" hidden>最初から試す</button>
  <script>
    window.ALL_GYRO_TEST_CONFIG = {
      imageTargetSrc: '../assets/05/05_target_800.mind',
      videoSrc: '../assets/all/all_dance.mp4',
      personHeight: 2.0,
      fifthPersonFraction: 0.45,
      brightness: 1.2
    };
  </script>
  <script>
    // Plain browser script: diagnostics and click work even if ESM dependencies fail.
    window.ALL_GYRO_TEST_READY = false;
    window.ALL_GYRO_MOTION_PERMISSION = null;
    const startBtn = document.getElementById('start-button');
    const startPane = document.getElementById('start-overlay');
    const messagePane = document.getElementById('test-status');
    const restartBtn = document.getElementById('test-restart');
    let clicked = false;
    let launched = false;
    let loadFailure = null;

    restartBtn.addEventListener('click', () => window.location.reload());

    function showLoadError(error) {
      loadFailure = error;
      const detail = error && (error.stack || error.message) || String(error);
      console.error('ALL gyro module load:', error);
      messagePane.textContent = 'AR読み込みエラー：' + detail;
      restartBtn.hidden = false;
      if (!clicked) {
        startBtn.textContent = '読み込みエラー（タップして内容を確認）';
      }
    }

    function launchWhenReady() {
      if (!clicked || launched || loadFailure || typeof window.ALL_GYRO_START !== 'function') return;
      launched = true;
      try {
        Promise.resolve(window.ALL_GYRO_START()).catch(showLoadError);
      } catch (error) {
        showLoadError(error);
      }
    }
    window.addEventListener('ALL_GYRO_READY', launchWhenReady);

    window.addEventListener('error', event => {
      if (!window.ALL_GYRO_TEST_READY && !loadFailure) {
        showLoadError(new Error((event.message || 'スクリプトエラー') + ' (' + (event.filename || '') + ':' + (event.lineno || '') + ')'));
      }
    });

    startBtn.addEventListener('click', () => {
      if (clicked) return;
      clicked = true;
      startPane.classList.add('hidden');
      messagePane.textContent = '起動操作を受け付けました。ARエンジンを読み込んでいます…';

      try {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          window.ALL_GYRO_MOTION_PERMISSION = DeviceOrientationEvent.requestPermission();
        }
      } catch (error) {
        console.warn('Sensor permission request:', error);
      }
      if (loadFailure) showLoadError(loadFailure);
      else launchWhenReady();
    });

    // Explicit import allows us to report the actual rejection instead of
    // silently waiting for a module script that never calls its entrypoint.
    const moduleUrl = new URL('../js/ar-all-gyro-test.js?v=20261016f', document.baseURI).href;
    import(moduleUrl)
      .then(() => {
        if (!window.ALL_GYRO_TEST_READY) {
          showLoadError(new Error('JS読み込み後の初期化に到達しませんでした'));
        } else {
          launchWhenReady();
        }
      })
      .catch(showLoadError);

    window.setTimeout(() => {
      if (clicked && !window.ALL_GYRO_TEST_READY && !loadFailure) {
        messagePane.textContent = 'ARライブラリの応答を待っています。通信が遅い可能性があります（20秒以上）。';
      }
    }, 20000);
  </script>
</body>
</html>
